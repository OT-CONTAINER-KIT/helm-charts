apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sentryfuse-dev
  namespace: envoy-gateway-system
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: web-gateway
  hostnames:
  - sentryfuse.opstree.dev
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""
      kind: Service
      name: sentryfuse-frontend-x-sentryfuse-x-coe-dev-vcluster
      namespace: coe-dev
      port: 80
      weight: 1
---
