apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "pmm.fullname" . }}
  labels:
{{ include "pmm.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.pmm.replicaCount }}

  selector:
    matchLabels:
      app: {{ include "pmm.name" . }}

  template:
    metadata:
      labels:
        app: {{ include "pmm.name" . }}

    spec:
      serviceAccountName: {{ include "pmm.fullname" . }}

{{- with .Values.podSecurityContext }}
      securityContext:
{{ toYaml . | nindent 8 }}
{{- end }}

{{- if .Values.permissionFix.enabled }}
      initContainers:
        - name: fix-pmm-permissions
          image: {{ .Values.permissionFix.image }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              chown -R {{ .Values.permissionFix.runAsUser }}:{{ .Values.permissionFix.fsGroup }} /srv
              chmod -R g+rwX /srv
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: pmm-data
              mountPath: /srv
{{- end }}

      containers:
        - name: pmm-server
          image: "{{ .Values.pmm.image.repository }}:{{ .Values.pmm.image.tag }}"
          imagePullPolicy: {{ .Values.pmm.image.pullPolicy }}

          ports:
            - name: https
              containerPort: 8443

          env:
{{- if .Values.externalClickHouse.enabled }}
            - name: PMM_DISABLE_BUILTIN_CLICKHOUSE
              value: "1"
              
            - name: PMM_CLICKHOUSE_ADDR
              value: "{{ .Values.externalClickHouse.host }}:{{ .Values.externalClickHouse.port }}"

            - name: PMM_CLICKHOUSE_HOST
              value: "{{ .Values.externalClickHouse.host }}"

            - name: PMM_CLICKHOUSE_PORT
              value: "{{ .Values.externalClickHouse.port }}"

            - name: PMM_CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "pmm.fullname" . }}-secret
                  key: PMM_CLICKHOUSE_USERNAME

            - name: PMM_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pmm.fullname" . }}-secret
                  key: PMM_CLICKHOUSE_PASSWORD
{{- end }}

          volumeMounts:
            - name: pmm-data
              mountPath: /srv

          resources:
{{ toYaml .Values.resources | nindent 12 }}

          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 60
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 120
            periodSeconds: 20

      volumes:
        - name: pmm-data
          persistentVolumeClaim:
            claimName: {{ include "pmm.fullname" . }}

{{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | nindent 8 }}
{{- end }}

{{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | nindent 8 }}
{{- end }}

{{- with .Values.affinity }}
      affinity:
{{ toYaml . | nindent 8 }}
{{- end }}
