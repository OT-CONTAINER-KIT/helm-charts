{{- if .Values.networkPolicy.enabled }}

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: {{ include "pmm.fullname" . }}

spec:

  podSelector:

    matchLabels:

      app: {{ include "pmm.name" . }}

  policyTypes:

    - Ingress

    - Egress

  ingress:

    - {}

  egress:

    - {}

{{- end }}
