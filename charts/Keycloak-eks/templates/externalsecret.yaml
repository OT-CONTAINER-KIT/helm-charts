{{- if and .Values.externalSecrets .Values.externalSecrets.enabled -}}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "keycloak.fullname" . }}-secretstore
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ default "us-east-1" .Values.externalSecrets.awsRegion }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "keycloak.serviceAccountName" . }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "keycloak.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ include "keycloak.fullname" . }}-secretstore
    kind: SecretStore
  target:
    name: {{ include "keycloak.dbSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: db-host
      remoteRef:
        key: {{ .Values.externalSecrets.awsSecretName }}
        property: db-host
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.awsSecretName }}
        property: db-password
    - secretKey: admin-password
      remoteRef:
        key: {{ .Values.externalSecrets.awsSecretName }}
        property: admin-password
{{- end }}
