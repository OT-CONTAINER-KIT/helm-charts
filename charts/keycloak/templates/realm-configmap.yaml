{{- if and .Values.realmImport.enabled (not .Values.realmImport.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-realm" (include "keycloak.fullname" .) }}
  {{- with .Values.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
data:
  {{- /* realm JSON files bundled in the chart under realms/*.json */}}
  {{- range $path, $_ := .Files.Glob "realms/*.json" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
  {{- /* plus any realm JSON passed inline via realmImport.files */}}
  {{- range $name, $content := .Values.realmImport.files }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
