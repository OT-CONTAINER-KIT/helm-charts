# keycloak-values.yaml — Keycloak for the kubelift namespace on sr-staging-eks-cluster.
# (BuildPiper expects this exact filename: keycloak-values.yaml)
#
# Deploy (Helm):
#   export KUBECONFIG=/home/buildpiper/.kube/sr-staging-eks-cluster/config
#   helm upgrade --install keycloak ./charts/keycloak -n kubelift \
#     -f keycloak-values.yaml --wait --timeout 10m
#
# Deploy (BuildPiper / GitOps):
#   helm template keycloak ./charts/keycloak -n kubelift -f keycloak-values.yaml \
#     | kubectl apply -n kubelift -f -
#
# Release name MUST be "keycloak" -> objects are named "keycloak" (Service, Deployment).
# In-cluster URL: http://keycloak.kubelift.svc.cluster.local
#
# Pre-req in the namespace (created out-of-band, NOT by this chart):
#   Secret  keycloak-secret  (Opaque)  keys: db-password=keycloak, admin-password=admin
#   DB      keycloak / role keycloak / password keycloak  on the shared Postgres

namespace: kubelift                        # stamp kubelift on every object (BuildPiper defaults to "default" otherwise)
fullnameOverride: keycloak                 # objects are always "keycloak" regardless of the BP release name
                                           # -> in-cluster URL: http://keycloak.kubelift.svc.cluster.local

replicaCount: 1

image:
  registry: 552171489163.dkr.ecr.ap-south-1.amazonaws.com
  repository: kubelift/keycloak            # pre-optimized image, built by BuildPiper from charts/keycloak/Dockerfile
  tag: "26.3.3"                            # set to whatever tag BuildPiper pushes (or let BP inject it)
  pullPolicy: Always
  pullSecrets: sr-stage-aws-ecr-regcred    # string form

mode: production
optimized: true                            # image is pre-built (kc.sh build) -> start --optimized
                                           # db/health/cache/schema are baked in the Dockerfile

http:
  enabled: true
  port: 8080
  managementPort: 9000

proxy: "xforwarded"                                  # ALB terminates TLS upstream
hostname: "https://sr-kubelift-auth.shiprocket.in"   # public Keycloak URL (via kubelift-istio-gateway)
                                                     # -> fixes issuer / redirect / OIDC-metadata URLs
hostnameStrict: false                                # keep false until the host is live + stable, then
                                                     # flip true (rejects any other Host header). false
                                                     # still lets kubectl port-forward reach the console.

health:
  enabled: true
metrics:
  enabled: false

cache: "local"                             # single replica

db:
  vendor: postgres
  host: stateless-app-postgresql-helm-chart.kubelift.svc.cluster.local
  port: 5432
  name: keycloak
  schema: public
  user: keycloak
  extraParams: "sslmode=disable"
  password: ""                             # unused — existingSecret below
  url: ""

auth:
  adminUser: admin
  adminPassword: ""                        # unused — existingSecret below

existingSecret: keycloak-secret
existingSecretKeys:
  dbPassword: db-password
  adminPassword: admin-password

# Bootstrap the "kubelift" realm + public SPA client "kubelift" (PKCE S256) + user
# "kubelift"/"kubelift" from charts/keycloak/realms/kubelift-realm.json on first start.
# Create-only: a redeploy against the existing DB just logs "realm exists, skipped".
realmImport:
  enabled: true
  existingConfigMap: ""
  files: {}

service:
  type: ClusterIP
  port: 80

resources:
  requests: { cpu: 300m, memory: 1Gi }
  limits:   { cpu: "2",  memory: 2Gi }

startupProbe:
  enabled: true
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30        # ~5 min budget for first-boot Liquibase on the empty DB
readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 10
livenessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 6

podLabels:
  admission.datadoghq.com/enabled: "false"   # opt out of the cluster Datadog admission webhook

podAnnotations: {}

serviceAccount:
  create: false

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: "100%"
    maxUnavailable: "50%"

# The BuildPiper-built image is amd64-only (like kubelift/postgres); pin to amd64 nodes.
nodeSelector:
  kubernetes.io/arch: amd64
affinity: {}
tolerations: []
