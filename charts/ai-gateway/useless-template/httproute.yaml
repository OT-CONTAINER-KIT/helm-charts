{{- if .Values.gatewayApi.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-litellm
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ required "gatewayApi.parentRef.name is required when gatewayApi.enabled=true" .Values.gatewayApi.parentRef.name | quote }}
      {{- if .Values.gatewayApi.parentRef.namespace }}
      namespace: {{ .Values.gatewayApi.parentRef.namespace | quote }}
      {{- end }}
  hostnames:
    - {{ required "gatewayApi.hostname is required when gatewayApi.enabled=true" .Values.gatewayApi.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gatewayApi.pathPrefix | default "/" | quote }}
      backendRefs:
        - name: {{ .Release.Name }}-litellm-proxy
          port: {{ .Values.service.port | default .Values.litellm.port }}
{{- end }}
