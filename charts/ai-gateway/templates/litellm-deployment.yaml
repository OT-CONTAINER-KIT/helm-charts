apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-litellm
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app: litellm
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.litellm.replicas }}
  {{- end }}
  strategy:
    type: {{ .Values.litellm.strategy.type }}
    rollingUpdate:
      maxUnavailable: {{ .Values.litellm.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.litellm.strategy.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/litellm-config.yaml") . | sha256sum }}
        {{- with .Values.litellm.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app: litellm
    spec:
      terminationGracePeriodSeconds: {{ .Values.litellm.terminationGracePeriodSeconds }}
      {{- if .Values.litellm.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.litellm.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- if .Values.litellm.affinity }}
      affinity:
        {{- toYaml .Values.litellm.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.litellm.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.litellm.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.litellm.tolerations }}
      tolerations:
        {{- toYaml .Values.litellm.tolerations | nindent 8 }}
      {{- end }}
      containers:
        - name: litellm
          image: {{ .Values.litellm.image }}
          imagePullPolicy: {{ .Values.litellm.imagePullPolicy | default "IfNotPresent" }}
          {{- if .Values.litellm.securityContext }}
          securityContext:
            {{- toYaml .Values.litellm.securityContext | nindent 12 }}
          {{- end }}

          args:
            - "--config"
            - "/app/config.yaml"
            - "--port"
            - "{{ .Values.litellm.port }}"
            - "--num_workers"
            - "{{ .Values.litellm.workers }}"
            {{- if .Values.litellm.maxRequestsBeforeRestart }}
            - "--max_requests_before_restart"
            - "{{ .Values.litellm.maxRequestsBeforeRestart }}"
            {{- end }}

          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-litellm-secret" .Release.Name) .Values.litellm.existingSecret }}
                  key: masterKey

            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-litellm-secret" .Release.Name) .Values.litellm.existingSecret }}
                  key: saltKey

            - name: STORE_MODEL_IN_DB
              value: "True"

            {{- if and .Values.sso.enabled (ne (toString .Values.sso.enabled) "false") }}
            - name: GENERIC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-sso-secret" .Release.Name) .Values.sso.existingSecret }}
                  key: GENERIC_CLIENT_ID
            - name: GENERIC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-sso-secret" .Release.Name) .Values.sso.existingSecret }}
                  key: GENERIC_CLIENT_SECRET
            - name: GENERIC_AUTHORIZATION_ENDPOINT
              value: {{ .Values.sso.authorizationEndpoint | quote }}
            - name: GENERIC_TOKEN_ENDPOINT
              value: {{ .Values.sso.tokenEndpoint | quote }}
            - name: GENERIC_USERINFO_ENDPOINT
              value: {{ .Values.sso.userinfoEndpoint | quote }}
            - name: GENERIC_SCOPE
              value: {{ default "openid email profile" .Values.sso.scope | quote }}
            {{- if .Values.sso.proxyBaseUrl }}
            - name: PROXY_BASE_URL
              value: {{ .Values.sso.proxyBaseUrl | quote }}
            {{- end }}
            {{- end }}

            {{- if .Values.postgres.enabled }}
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@{{ .Release.Name }}-postgres:5432/{{ .Values.postgres.database }}"
            {{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-postgres-external-secret" .Release.Name) .Values.postgres.external.existingSecret }}
                  key: {{ default "DATABASE_URL" .Values.postgres.external.databaseUrlKey }}
            {{- end }}

            {{- if and (not .Values.redis.enabled) (or .Values.redis.external.existingSecret .Values.redis.external.password) }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-redis-external-secret" .Release.Name) .Values.redis.external.existingSecret }}
                  key: {{ default "REDIS_PASSWORD" .Values.redis.external.passwordKey }}
            {{- end }}

            # Provider API Keys (mounted from existingSecret or chart secret)
            {{- if or .Values.litellm.providers.openrouterApiKey .Values.litellm.existingSecret }}
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-litellm-secret" .Release.Name) .Values.litellm.existingSecret }}
                  key: openrouterApiKey
            {{- end }}
            {{- if or .Values.litellm.providers.geminiApiKey (and .Values.litellm.existingSecret (eq .Values.litellm.providers.geminiApiKey "enable")) }}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-litellm-secret" .Release.Name) .Values.litellm.existingSecret }}
                  key: geminiApiKey
            {{- end }}
            {{- if or .Values.litellm.providers.openaiApiKey (and .Values.litellm.existingSecret (eq .Values.litellm.providers.openaiApiKey "enable")) }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-litellm-secret" .Release.Name) .Values.litellm.existingSecret }}
                  key: openaiApiKey
            {{- end }}
            {{- if or .Values.litellm.providers.anthropicApiKey (and .Values.litellm.existingSecret (eq .Values.litellm.providers.anthropicApiKey "enable")) }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-litellm-secret" .Release.Name) .Values.litellm.existingSecret }}
                  key: anthropicApiKey
            {{- end }}

            {{- if .Values.litellm.extraEnv }}
            {{- toYaml .Values.litellm.extraEnv | nindent 12 }}
            {{- end }}

          ports:
            - name: proxy
              containerPort: {{ .Values.litellm.port }}
              protocol: TCP

          resources:
            {{- toYaml .Values.litellm.resources | nindent 12 }}

          readinessProbe:
            {{- toYaml .Values.litellm.readinessProbe | nindent 12 }}

          {{- if .Values.litellm.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.litellm.livenessProbe | nindent 12 }}
          {{- end }}

          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]

          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- if .Values.litellm.extraVolumeMounts }}
            {{- toYaml .Values.litellm.extraVolumeMounts | nindent 12 }}
            {{- end }}

      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-litellm-config
        {{- if .Values.litellm.extraVolumes }}
        {{- toYaml .Values.litellm.extraVolumes | nindent 8 }}
        {{- end }}
