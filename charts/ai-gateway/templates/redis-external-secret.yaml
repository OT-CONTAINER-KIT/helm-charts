{{- if and (not .Values.redis.enabled) (not .Values.redis.external.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-redis-external-secret
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  REDIS_PASSWORD: {{ .Values.redis.external.password | quote }}
{{- end }}