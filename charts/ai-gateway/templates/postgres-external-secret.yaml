{{- if and (not .Values.postgres.enabled) (not .Values.postgres.external.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres-external-secret
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.postgres.external.databaseUrl | quote }}
{{- end }}