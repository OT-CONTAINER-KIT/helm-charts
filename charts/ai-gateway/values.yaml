# buildpiper-helm — values.yaml
# LiteLLM proxy using organization-managed external Postgres and Redis.
# Do not store real passwords in this file. Store passwords in Kubernetes Secrets.

litellm:
  image: ghcr.io/berriai/litellm:main-stable
  replicas: 1
  workers: 2
  port: 4000

  # Master admin key — generate a strong value before install:
  #   helm install ... --set litellm.masterKey=sk-$(openssl rand -hex 24)
  existingSecret: ai-gateway-litellm-secret
  masterKey: ""
  saltKey: ""

  # Provider API keys (set what you actually use; leave others blank)
  providers:
    geminiApiKey: ""
    openaiApiKey: ""
    anthropicApiKey: ""

  # The litellm-config.yaml mounted into the container
  # Edit the model_list as you onboard models
  config:
    model_list: []
      # Example:
      # - model_name: gemini-flash
      #   litellm_params:
      #     model: gemini/gemini-1.5-flash
      #     api_key: os.environ/GEMINI_API_KEY
      #     rpm: 60
      #     tpm: 100000

    router_settings:
      routing_strategy: simple-shuffle
      num_retries: 2
      timeout: 600
      allowed_fails: 3
      cooldown_time: 30

    litellm_settings:
      cache: true
      cache_params:
        type: redis
        host: "192.168.8.78"
        port: 6379
        password: os.environ/REDIS_PASSWORD
        ttl: 600
      drop_params: true
      set_verbose: false

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      store_model_in_db: true

postgres:
  enabled: false
  external:
    host: "192.168.8.39"
    port: 5432
    existingSecret: ai-gateway-db-secret
    databaseUrlKey: DATABASE_URL

redis:
  enabled: false
  external:
    host: "192.168.8.78"
    port: 6379
    existingSecret: ai-gateway-redis-secret
    passwordKey: REDIS_PASSWORD

ingress:
  enabled: true
  className: nginx
  hosts:
    proxy: ai-gateway.example.internal
    ui: ai-gateway-ui.example.internal

tls:
  enabled: false
  crt: ""
  key: ""

service:
  type: ClusterIP
  proxyNodePort: 30400
