# buildpiper-helm — values.yaml
litellm:
  image: ghcr.io/berriai/litellm:main-stable
  replicas: 1
  workers: 2
  port: 4000

  existingSecret: ""
  masterKey: ""
  saltKey: ""

  providers:
    geminiApiKey: ""
    openaiApiKey: ""
    anthropicApiKey: ""

  config:
    model_list: []

    router_settings:
      routing_strategy: simple-shuffle
      num_retries: 2
      timeout: 600
      allowed_fails: 3
      cooldown_time: 30

    litellm_settings:
      cache: true
      cache_params:
        type: redis
        host: "192.168.8.78"
        port: 6379
        ttl: 600        
      drop_params: true
      set_verbose: false

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      store_model_in_db: true

postgres:
  enabled: false
  external:
    host: "192.168.8.39"
    port: 5432
    existingSecret: ""
    databaseUrlKey: DATABASE_URL
    databaseUrl: ""           # set via Buildpiper KV

redis:
  enabled: false
  external:
    host: "192.168.8.78"
    port: 6379
    existingSecret: ""
    passwordKey: REDIS_PASSWORD
    password: ""

ingress:
  enabled: true
  className: nginx
  hosts:
    proxy: ai-gateway.example.internal
    ui: ai-gateway-ui.example.internal

tls:
  enabled: false
  crt: ""
  key: ""

service:
  type: ClusterIP
  proxyNodePort: 30400