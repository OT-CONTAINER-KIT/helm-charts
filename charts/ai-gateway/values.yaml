# buildpiper-helm — values.yaml
# namespace: ai-gateway
litellm:
  image: ghcr.io/berriai/litellm@sha256:75543fa1d73989b7aefba49c910989f7886f63210520e30b39dbbc580a41826f
  imagePullPolicy: Always
  replicas: 2
  workers: 1
  port: 4000

  resources:
    requests:
      cpu: "1"
      memory: "4Gi"
    limits:
      cpu: "1"
      memory: "4Gi"

  readinessProbe:
    httpGet:
      path: /health/readiness
      port: 4000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1

  terminationGracePeriodSeconds: 620
  maxRequestsBeforeRestart: 10000

  extraEnv:
    - name: LITELLM_LOG
      value: "ERROR"
    - name: LITELLM_MODE
      value: "PRODUCTION"
    - name: DISABLE_SCHEMA_UPDATE
      value: "true"

  existingSecret: ""
  masterKey: ""
  saltKey: ""

  providers:
    geminiApiKey: ""
    openaiApiKey: ""
    anthropicApiKey: ""

  config:
    model_list: []

    router_settings:
      routing_strategy: simple-shuffle
      num_retries: 2
      timeout: 600
      allowed_fails: 3
      cooldown_time: 30

    litellm_settings:
      cache: true
      cache_params:
        type: redis
        host: "192.168.8.78"
        port: 6379
        ttl: 600        
      drop_params: true
      set_verbose: false

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      store_model_in_db: true

postgres:
  enabled: false
  external:
    host: "192.168.8.39"
    port: 5432
    existingSecret: ""
    databaseUrlKey: DATABASE_URL
    databaseUrl: ""           # set via Buildpiper KV

redis:
  enabled: false
  external:
    host: "192.168.8.78"
    port: 6379
    existingSecret: ""
    passwordKey: REDIS_PASSWORD
    password: ""

ingress:
  enabled: false
  className: nginx
  hosts:
    proxy: ai-gateway.example.internal
    ui: ai-gateway-ui.example.internal

gatewayApi:
  enabled: false
  hostname: ai-gateway.opstree.dev
  parentRef:
    # Ask the Envoy Gateway/platform team for these two values.
    name: ""
    namespace: ""
  pathPrefix: /

tls:
  enabled: false
  crt: ""
  key: ""

service:
  type: ClusterIP
  port: 80

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  cpu: 60
  memory: 80
