# =============================================================================
# BuildPiper LiteLLM AI Gateway Helm Chart — Production values.yaml
# Architecture: External PostgreSQL + External Redis + Gateway API / Kong Ingress
# =============================================================================

litellm:
  image: ghcr.io/berriai/litellm@sha256:75543fa1d73989b7aefba49c910989f7886f63210520e30b39dbbc580a41826f
  imagePullPolicy: IfNotPresent
  replicas: 2
  workers: 1
  port: 4000

  # Production Resource Allocation (Guaranteed QoS)
  resources:
    requests:
      cpu: "1"
      memory: "4Gi"
    limits:
      cpu: "1"
      memory: "4Gi"

  # Health & Liveness Probes
  readinessProbe:
    httpGet:
      path: /health/readiness
      port: 4000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1

  livenessProbe:
    httpGet:
      path: /health/liveliness
      port: 4000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Zero-Downtime Rolling Update & LLM Stream Protection
  terminationGracePeriodSeconds: 620
  maxRequestsBeforeRestart: 10000

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  # High-Availability Pod Disruption Budget
  pdb:
    enabled: true
    minAvailable: 1

  # Security Context (Default root execution for full permission access)
  podSecurityContext: {}
  securityContext: {}

  # High Availability: Spread pods across distinct worker nodes
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - litellm
            topologyKey: "kubernetes.io/hostname"

  nodeSelector: {}
  tolerations: []
  podAnnotations: {}

  # Runtime Environment
  extraEnv:
    - name: LITELLM_LOG
      value: "ERROR"
    - name: LITELLM_MODE
      value: "PRODUCTION"
    - name: DISABLE_SCHEMA_UPDATE
      value: "true"

  # ===========================================================================
  # BuildPiper Secret Integration:
  # Option A (Recommended): Set existingSecret to a pre-created K8s secret name.
  # Option B: Leave existingSecret empty ("") and provide values via BuildPiper KV.
  # ===========================================================================
  existingSecret: ""
  masterKey: ""
  saltKey: ""

  providers:
    geminiApiKey: ""
    openaiApiKey: ""
    anthropicApiKey: ""
    openrouterApiKey: ""

  # LiteLLM Proxy Configuration (Mounted to /app/config.yaml)
  config:
    model_list:
      # 1. NVIDIA Nemotron 3 Ultra 550B (Frontier reasoning model)
      - model_name: nemotron-3-ultra-free
        litellm_params:
          model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
          api_key: "os.environ/OPENROUTER_API_KEY"

      # 2. OpenAI GPT-OSS 120B (High-reasoning agentic model)
      - model_name: gpt-oss-120b-free
        litellm_params:
          model: openrouter/openai/gpt-oss-120b:free
          api_key: "os.environ/OPENROUTER_API_KEY"

      # 3. Google Gemma 4 31B Instruct (Dense multimodal model)
      - model_name: gemma-4-31b-free
        litellm_params:
          model: openrouter/google/gemma-4-31b-it:free
          api_key: "os.environ/OPENROUTER_API_KEY"

      # 4. NVIDIA Nemotron 3 Super 120B (Efficient hybrid MoE)
      - model_name: nemotron-3-super-free
        litellm_params:
          model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
          api_key: "os.environ/OPENROUTER_API_KEY"

    router_settings:
      routing_strategy: simple-shuffle
      num_retries: 2
      timeout: 600
      allowed_fails: 3
      cooldown_time: 30

    litellm_settings:
      request_timeout: 600
      stream_timeout: 300
      cache: true
      cache_params:
        type: redis
        host: "192.168.8.78"
        port: 6379
        password: "os.environ/REDIS_PASSWORD"
        ttl: 600
      drop_params: true
      set_verbose: false
      success_callback:
        - "langfuse"
      failure_callback:
        - "langfuse"

    general_settings:
      master_key: "os.environ/LITELLM_MASTER_KEY"
      store_model_in_db: true
      pass_through_request_timeout: 600
      store_audit_logs: false

# =============================================================================
# Automated DB Migration Hook (Runs once before deployment rollout)
# =============================================================================
migration:
  enabled: true
  image: ""

# =============================================================================
# External PostgreSQL (Shared Central DB)
# Note: For HA under high load, ensure connection_limit=5 is in DATABASE_URL
# =============================================================================
postgres:
  enabled: false
  username: "ai-db-user"
  database: "ai-gateway-db"
  external:
    host: "192.168.8.39"
    port: 5432
    existingSecret: ""
    databaseUrlKey: DATABASE_URL
    databaseUrl: ""           # Injected via BuildPiper KV or pre-created secret

# =============================================================================
# External Redis (Shared Central Cache & Rate Limiter)
# =============================================================================
redis:
  enabled: false
  external:
    host: "192.168.8.78"
    port: 6379
    existingSecret: ""
    passwordKey: REDIS_PASSWORD
    password: ""              # Injected via BuildPiper KV or pre-created secret

# =============================================================================
# Langfuse Cloud Observability (BuildPiper Integration)
# =============================================================================
langfuse:
  enabled: true
  host: ""                              # Injected via BuildPiper UI (e.g. https://us.cloud.langfuse.com)
  existingSecret: ""                    # Leave empty if using BuildPiper KV
  publicKey: ""                         # Injected via BuildPiper UI
  secretKey: ""                         # Injected via BuildPiper UI

# =============================================================================
# SSO / OIDC (Keycloak) Configuration
# =============================================================================
sso:
  enabled: false
  existingSecret: ""
  clientId: ""
  clientSecret: ""
  authorizationEndpoint: ""
  tokenEndpoint: ""
  userinfoEndpoint: ""
  scope: "openid email profile"
  proxyBaseUrl: ""

# =============================================================================
# Internal Kubernetes Service (Target for Gateway API / Kong HTTPRoute)
# =============================================================================
service:
  type: ClusterIP
  port: 80
  proxyNodePort: 30000
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4000"
    prometheus.io/path: "/metrics"

# =============================================================================
# Horizontal Pod Autoscaler (HPA)
# =============================================================================
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  cpu: 60
  memory: 80
