Almost — but there are 4 things you should always update together to keep your deployment clean and tracked:                                                                                                      
                                                                                                                                                                                                                   
 1. values.yaml → image tag (yes, this is the main one)                                                                                                                                                            
 2. Chart.yaml → appVersion (should match your image version for clarity)                                                                                                                                          
 3. Check release notes for any new required env vars or config.yaml changes                                                                                                                                       
 4. Database migrations — since you have DISABLE_SCHEMA_UPDATE=true, you must run migrations separately before upgrading                                                                                           
                                                                                                                                                                                                                   
 Example future upgrade:                                                                                                                                                                                           
                                                                                                                                                                                                                   
 ```yaml                                                                                                                                                                                                           
   # values.yaml                                                                                                                                                                                                   
   litellm:                                                                                                                                                                                                        
     image: ghcr.io/berriai/litellm:v1.88.0                                                                                                                                                                        
 ```                                                                                                                                                                                                               
                                                                                                                                                                                                                                                                                                                                                                                                                                      
 ```yaml                                                                                                                                                                                                           
   # Chart.yaml                                                                                                                                                                                                    
   appVersion: "1.88.0"                                                                                                                                                                                            
 ```                                                                                                                                                                                                               
                                                                                                                                                                                                                   
 Then redeploy.                                                                                                                                                                                                    
                                                                                                                                                                                                                   
 ────────────────────────────────────────────────────────────────────────────────                                                                                                                                  

 ### If you want to automate this entirely:                                                                                                                                                                        
                                                                                                                                                                                                                   
 Instead of manually bumping versions, you can set your image tag to track digest (immutable) rather than version tags:                                                                                            
                                                                                                                                                                                                                   
 ```yaml                                                                                                                                                                                                           
   # values.yaml                                                                                                                                                                                                   
   litellm:                                                                                                                                                                                                        
     image: ghcr.io/berriai/litellm:v1.87.1                                                                                                                                                                        
     imagePullPolicy: IfNotPresent                                                                                                                                                                                 
 ```                                                                                                                                                                                                               
                                                                                                                                                                                                                   
 Or use a tool like Renovate or Dependabot to open PRs with version bumps automatically.                                                                                                                           
                                                                                                                                                                                                                   
 And yes — always check the LiteLLM releases page (https://github.com/BerriAI/litellm/releases) for breaking changes before upgrading. They occasionally change config.yaml schemas or env vars between minor      
 versions.                                       