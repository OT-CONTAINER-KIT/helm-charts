---
apiVersion: v1
kind: ConfigMap
metadata:
  name: outline-db-backup-script
  namespace: docs
data:
  db-backup-script.sh: |
    #!/bin/sh

    # Outline Postgres backup script (shared by daily/monthly/yearly CronJobs)
    set -e
    set -o pipefail

    # Configuration (BACKUP_PREFIX and RETENTION_DAYS come from CronJob env)
    BACKUP_DIR="/backup"
    BACKUP_PREFIX="${BACKUP_PREFIX:-daily}"
    RETENTION_DAYS="${RETENTION_DAYS:-7}"
    TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
    BACKUP_FILENAME="outline-db_${TIMESTAMP}.sql.gz"

    # From environment (DATABASE_URL read-only from outline-postgres-external-secret)
    DATABASE_URL="${DATABASE_URL:?DATABASE_URL env must be set}"
    MINIO_ENDPOINT="${MINIO_ENDPOINT}"
    MINIO_ACCESS_KEY="${MINIO_ACCESS_KEY}"
    MINIO_SECRET_KEY="${MINIO_SECRET_KEY}"
    MINIO_BUCKET="${MINIO_BUCKET}"

    log() {
        echo "[$(date +'%Y-%m-%d %H:%M:%S')] $1"
    }

    log "DB backup tier: $BACKUP_PREFIX (retention: $RETENTION_DAYS days)"
    log "pg_dump version: $(pg_dump --version)"
    log "Server version: $(psql "$DATABASE_URL" -tAc 'SELECT version();')"

    # Install mc (NOTE: old /client/mc path is retired by MinIO -> HTTP 410;
    # current path is /aistor/mc. -f fails fast instead of saving HTML.)
    if ! command -v curl >/dev/null 2>&1; then
        log "Installing curl..."
        apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    fi
    log "Installing MinIO Client..."
    curl -fsSL https://dl.min.io/aistor/mc/release/linux-amd64/mc -o /usr/local/bin/mc
    chmod +x /usr/local/bin/mc
    mc --version

    # Configure mc
    log "Configuring MinIO Client..."
    mc alias set minio-backup $MINIO_ENDPOINT $MINIO_ACCESS_KEY $MINIO_SECRET_KEY --api S3v4

    # Dump (plain SQL, gzipped — restores on this or any newer PG via psql)
    log "Dumping database to $BACKUP_PREFIX/$BACKUP_FILENAME ..."
    mkdir -p $BACKUP_DIR
    pg_dump -Fp -d "$DATABASE_URL" | gzip > $BACKUP_DIR/$BACKUP_FILENAME
    BACKUP_SIZE=$(du -h $BACKUP_DIR/$BACKUP_FILENAME | cut -f1)
    log "Dump created: $BACKUP_FILENAME ($BACKUP_SIZE)"

    # Sanity: a dump that is suspiciously small is likely an empty/error dump
    BACKUP_BYTES=$(wc -c < $BACKUP_DIR/$BACKUP_FILENAME)
    if [ "$BACKUP_BYTES" -lt 10240 ]; then
        log "ERROR: dump is only $BACKUP_BYTES bytes, refusing to upload"
        exit 1
    fi

    # Upload to MinIO
    log "Uploading to MinIO..."
    mc cp $BACKUP_DIR/$BACKUP_FILENAME minio-backup/$MINIO_BUCKET/$BACKUP_PREFIX/$BACKUP_FILENAME
    log "Uploaded to: $MINIO_ENDPOINT/$MINIO_BUCKET/$BACKUP_PREFIX/$BACKUP_FILENAME"

    # Cleanup old dumps in this tier's prefix (native mc age filter)
    log "Cleaning up $BACKUP_PREFIX dumps older than $RETENTION_DAYS days..."
    mc rm --force --recursive --older-than ${RETENTION_DAYS}d "minio-backup/$MINIO_BUCKET/$BACKUP_PREFIX/" || true

    log "Cleanup completed"

    # Cleanup local
    log "Cleaning up local dump file..."
    rm -f $BACKUP_DIR/$BACKUP_FILENAME

    log "=========================================="
    log "✅ DB backup completed successfully!"
    log "=========================================="
