# =============================================================================
# Outline Postgres backup — live production manifests (namespace: docs)
# =============================================================================
# WHAT RUNS IN THE CLUSTER (4 objects, `kubectl apply -f` this file):
#   1. CronJob/outline-db-backup-daily    schedule "30 2 * * *"  -> daily/   keep 7d
#   2. CronJob/outline-db-backup-monthly  schedule "30 3 1 * *"  -> monthly/ keep 365d
#   3. CronJob/outline-db-backup-yearly   schedule "30 4 1 1 *"  -> yearly/  keep 1095d (3y)
#   4. ConfigMap/outline-db-backup-script (db-backup-script.sh, shared by all three)
#
# NO new Secret: DB credentials come read-only from the existing
# Secret/outline-postgres-external-secret (key DATABASE_URL — same one the
# Outline Deployment uses), MinIO creds from Secret/minio-backup-secret.
# If your release name differs, adjust the DB secret name below.
#
# DUMP FORMAT: plain SQL (-Fp) gzipped -> outline-db_<ts>.sql.gz into
# s3://outline-db-backup/<daily|monthly|yearly>/ on
# https://minio.ldc.opstree.dev:9000. Plain SQL is deliberate: it restores
# with any psql >= the dump version, so a DBA upgrade (e.g. 14 -> 18) never
# breaks restores. See README.md (".sql vs .dump") for the full reasoning.
# Schedules sit 30 min after the file backups and use concurrencyPolicy:
# Forbid so two dumps never run at once.
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: outline-db-backup-daily
  namespace: docs
  labels:
    app: outline-db-backup
    tier: daily
spec:
  schedule: "30 2 * * *"  # Daily at 2:30 AM
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: outline-db-backup
            tier: daily
        spec:
          containers:
          - name: backup
            image: postgres:17
            command: ["/bin/sh", "/scripts/db-backup-script.sh"]
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: outline-postgres-external-secret
                  key: DATABASE_URL
            - name: MINIO_ENDPOINT
              value: "https://minio.ldc.opstree.dev:9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-backup-secret
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-backup-secret
                  key: secret-key
            - name: MINIO_BUCKET
              value: "outline-db-backup"
            - name: BACKUP_PREFIX
              value: "daily"
            - name: RETENTION_DAYS
              value: "7"
            volumeMounts:
            - name: backup-scripts
              mountPath: /scripts
            - name: backup-storage
              mountPath: /backup
          volumes:
          - name: backup-scripts
            configMap:
              name: outline-db-backup-script
              defaultMode: 0755
          - name: backup-storage
            emptyDir: {}
          restartPolicy: OnFailure
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
---
