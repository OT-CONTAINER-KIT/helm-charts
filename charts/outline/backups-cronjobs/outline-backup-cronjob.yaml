apiVersion: batch/v1
kind: CronJob
metadata:
  name: outline-backup-daily
  namespace: docs
  labels:
    app: outline-backup
    tier: daily
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: outline-backup
            tier: daily
        spec:
          containers:
          - name: backup
            image: alpine:latest
            command: ["/bin/sh", "/scripts/backup-script.sh"]
            env:
            - name: MINIO_ENDPOINT
              value: "https://minio.ldc.opstree.dev:9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-backup-secret
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-backup-secret
                  key: secret-key
            - name: MINIO_BUCKET
              value: "outline-pvc-backup"
            - name: BACKUP_PREFIX
              value: "daily"
            - name: RETENTION_DAYS
              value: "7"
            volumeMounts:
            - name: outline-data
              mountPath: /outline-data
              readOnly: true
            - name: backup-scripts
              mountPath: /scripts
            - name: backup-storage
              mountPath: /backup
          volumes:
          - name: outline-data
            persistentVolumeClaim:
              claimName: outline-outline-pvc
          - name: backup-scripts
            configMap:
              name: outline-backup-script
              defaultMode: 0755
          - name: backup-storage
            emptyDir: {}
          restartPolicy: OnFailure
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
---
