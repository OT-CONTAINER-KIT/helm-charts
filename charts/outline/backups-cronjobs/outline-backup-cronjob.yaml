apiVersion: v1
kind: Secret
metadata:
  name: minio-backup-secret
  namespace: docs
type: Opaque
stringData:
  access-key: "UZ86MT0IVFGNP8QDXWBK"  # Paste your access key here
  secret-key: "N71EsHvz1MAy32UMNEMPiAEa+jAoa0qu7TryycwE"  # Paste your secret key here
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: outline-backup-script
  namespace: docs
data:
  backup-script.sh: |
    #!/bin/sh

    # Outline PVC Backup Script (shared by daily/monthly/yearly CronJobs)
    set -e

    # Configuration (BACKUP_PREFIX and RETENTION_DAYS come from CronJob env)
    BACKUP_DIR="/backup"
    PVC_MOUNT="/outline-data"
    BACKUP_PREFIX="${BACKUP_PREFIX:-daily}"
    RETENTION_DAYS="${RETENTION_DAYS:-7}"
    TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
    BACKUP_FILENAME="outline_${TIMESTAMP}.tar.gz"

    # MinIO Configuration (from environment variables)
    MINIO_ENDPOINT="${MINIO_ENDPOINT}"
    MINIO_ACCESS_KEY="${MINIO_ACCESS_KEY}"
    MINIO_SECRET_KEY="${MINIO_SECRET_KEY}"
    MINIO_BUCKET="${MINIO_BUCKET}"

    log() {
        echo "[$(date +'%Y-%m-%d %H:%M:%S')] $1"
    }

    log "Backup tier: $BACKUP_PREFIX (retention: $RETENTION_DAYS days)"

    # Install required packages
    log "Installing required packages..."
    apk add --no-cache curl tar

    # Install mc (NOTE: old /client/mc path is retired by MinIO -> HTTP 410;
    # current path is /aistor/mc. -f makes curl fail fast on HTTP errors.)
    log "Installing MinIO Client..."
    curl -fsSL https://dl.min.io/aistor/mc/release/linux-amd64/mc -o /usr/local/bin/mc
    chmod +x /usr/local/bin/mc
    mc --version

    # Configure mc
    log "Configuring MinIO Client..."
    mc alias set minio-backup $MINIO_ENDPOINT $MINIO_ACCESS_KEY $MINIO_SECRET_KEY --api S3v4

    # Create backup
    log "Creating backup: $BACKUP_PREFIX/$BACKUP_FILENAME"
    mkdir -p $BACKUP_DIR
    tar -czf $BACKUP_DIR/$BACKUP_FILENAME -C $PVC_MOUNT .
    BACKUP_SIZE=$(du -h $BACKUP_DIR/$BACKUP_FILENAME | cut -f1)
    log "Backup created: $BACKUP_FILENAME ($BACKUP_SIZE)"

    # Upload to MinIO
    log "Uploading to MinIO..."
    mc cp $BACKUP_DIR/$BACKUP_FILENAME minio-backup/$MINIO_BUCKET/$BACKUP_PREFIX/$BACKUP_FILENAME
    log "Uploaded to: $MINIO_ENDPOINT/$MINIO_BUCKET/$BACKUP_PREFIX/$BACKUP_FILENAME"

    # Cleanup old backups in this tier's prefix (native mc age filter;
    # NOTE: --older-than needs a bucket/prefix path, not a shell wildcard)
    log "Cleaning up $BACKUP_PREFIX backups older than $RETENTION_DAYS days..."
    mc rm --force --recursive --older-than ${RETENTION_DAYS}d "minio-backup/$MINIO_BUCKET/$BACKUP_PREFIX/" || true

    log "Cleanup completed"

    # Cleanup local
    log "Cleaning up local backup files..."
    rm -f $BACKUP_DIR/$BACKUP_FILENAME

    log "=========================================="
    log "✅ Backup completed successfully!"
    log "=========================================="
