# outline — values.yaml

outline:
  image: outlinewiki/outline:0.82.0
  imagePullPolicy: IfNotPresent
  replicas: 2
  port: 3000

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

  readinessProbe:
    httpGet:
      path: /_health
      port: 3000
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  livenessProbe:
    httpGet:
      path: /_health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

  terminationGracePeriodSeconds: 30

  # Non-sensitive env vars — set via ConfigMap / inline
  url: "https://docs.opstree.dev"
  collaborationUrl: "wss://docs.opstree.dev"
  nodeEnv: "production"
  forceHttps: "false"
  trustProxy: "true"
  pgsslmode: "disable"
  fileStorage: "local"
  fileStorageLocalRootDir: "/var/lib/outline/data"

  # Sensitive values — stored in the outline secret
  existingSecret: ""
  secretKey: ""
  utilsSecret: ""

azure:
  enabled: false
  clientId: ""
  clientSecret: ""
  resourceAppId: ""

smtp:
  enabled: false
  host: "smtp-relay.brevo.com"
  port: 587
  username: ""
  password: ""
  fromEmail: ""
  tlsCiphers: "TLSv1.2"
  secure: "false"

postgres:
  enabled: false
  external:
    host: "postgres-central.opstree.dev"
    port: 5000
    existingSecret: ""
    databaseUrlKey: DATABASE_URL
    databaseUrl: ""           # set via Buildpiper KV

redis:
  enabled: false
  external:
    host: "192.168.8.78"
    port: 6379

persistence:
  enabled: true
  size: 5Gi
  storageClass: "vcluster-longhorn-restricted-x-coe-dev-x-coe-dev-vcluster"
  accessMode: ReadWriteMany
  mountPath: "/var/lib/outline/data"

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  cpu: 60
  memory: 80

backup:
  enabled: false
  schedule: "0 2 * * *"
  suspend: false
  image:
    repository: minio/mc
    tag: latest
    pullPolicy: IfNotPresent
  retention:
    days: 14
  minio:
    endpoint: "http://192.168.8.18:9000"
    bucket: "docs"
    pathPrefix: "outline-backups"
    existingSecret: ""
    accessKey: ""
    secretKey: ""
    accessKeyKey: "accessKey"
    secretKeyKey: "secretKey"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"