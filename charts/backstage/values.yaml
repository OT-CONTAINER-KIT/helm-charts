# Production Domain Configuration
domain: backstage.opstree.dev

# Backstage Application Configuration
backstage:
  replicaCount: 2
  image:
    repository: harbor.ldc.opstree.dev/coe/backstage-portal
    tag: latest
    pullPolicy: Always
  imagePullSecrets:
    - name: harbor-secret
  service:
    type: ClusterIP
    port: 80
    targetPort: 7007
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  probes:
    enabled: false
    liveness:
      path: /.well-known/healthcheck
      initialDelaySeconds: 60
      periodSeconds: 15
    readiness:
      path: /.well-known/healthcheck
      initialDelaySeconds: 30
      periodSeconds: 10

# Standalone LDC PostgreSQL Database Configuration (Passed dynamically via BuildPiper)
postgres:
  createSecret: true # Generates backstage-postgres-secrets containing USER & PASSWORD
  host: "YOUR_POSTGRES_HOST"
  port: 5432
  user: "YOUR_POSTGRES_USER"
  password: "YOUR_POSTGRES_PASSWORD"
  database: "backstage"
  ssl: false

# HPA Configuration
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# TLS Configuration
tls:
  enabled: false
  secretName: backstage-tls

# Application Secrets Management
secrets:
  create: true
  name: backstage-secrets
  githubToken: "YOUR_GITHUB_PAT"
  gitlabToken: "YOUR_GITLAB_PAT"
  backendSecret: "YOUR_BACKEND_SECRET_KEY"
  keycloakClientId: "backstage"
  keycloakClientSecret: "YOUR_KEYCLOAK_CLIENT_SECRET"
  keycloakMetadataUrl: "https://keycloak.opstree.dev/realms/master/.well-known/openid-configuration"
  keycloakIdpHint: "azure"
