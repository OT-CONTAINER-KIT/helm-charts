{{- range $key, $svc := .Values.services }}
{{- if and $svc.enabled (hasKey $svc "serviceAccount") }}
{{- $ctx := dict "root" $ "key" $key "svc" $svc }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ ($svc.serviceAccount | default dict).name | default (include "sentryfuse.name" $ctx) }}
  namespace: {{ $.Release.Namespace }}
  {{- with ($svc.serviceAccount | default dict).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "sentryfuse.labels" $ctx | nindent 4 }}
{{- end }}
{{- end }}
