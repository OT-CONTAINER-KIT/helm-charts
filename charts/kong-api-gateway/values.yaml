kong:
  image: kong/kong-gateway:latest
  replicaCount: 2

  database:
    enabled: false

  plugins:
    enabled: true
    list:
      - key-auth
      - jwt
      - rate-limiting
      - prometheus
      - opentelemetry

  env:
    KONG_DATABASE: postgres

    # External PostgreSQL connection
    KONG_PG_HOST: 192.168.8.39
    KONG_PG_PORT: "5432"
    KONG_PG_USER: kong-db-user
    KONG_PG_PASSWORD: KongGateway_2026_safe
    KONG_PG_DATABASE: kong-db

externalPostgres:
  enabled: true
  host: 192.168.8.39
  port: 5432

postgresql:
  enabled: false

  auth:
    username: kong-db-user
    password: KongGateway_2026_safe
    database: kong-db

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  cpu: 70

observability:
  otel:
    endpoint: http://otel-collector:4318

tls:
  enabled: false
