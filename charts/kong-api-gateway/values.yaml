kong:
  image: kong/kong-gateway:3.9.0
  replicaCount: 2

  database:
    enabled: false

postgresql:
  enabled: true
  auth:
    username: kong
    password: kongpass
    database: kong

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  cpu: 70

observability:
  prometheus:
    enabled: true
    external: true   # USE EXISTING PROMETHEUS
  grafana:
    enabled: true
    external: true   # USE EXISTING GRAFANA

  otel:
    enabled: true
    endpoint: http://otel-collector:4318

plugins:
  keyAuth: true
  jwt: true
  rateLimit: true
  prometheus: true
  opentelemetry: true

kong:
  plugins:
    enabled: true
    list:
      - key-auth
      - jwt
      - rate-limiting
      - prometheus
      - opentelemetry
