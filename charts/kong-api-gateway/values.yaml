kong:
  image: kong/kong-gateway:latest
  replicaCount: 2

  plugins:
    enabled: true
    list:
      - key-auth
      - jwt
      - rate-limiting
      - prometheus
      - opentelemetry

externalPostgres:
  enabled: true
  host: 192.168.8.39
  port: 5432
  user: kong-db-user
  password: KongGateway_2026_safe
  database: kong-db

postgresql:
  enabled: false

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  cpu: 70

observability:
  otel:
    endpoint: http://otel-collector:4318

tls:
  enabled: false
