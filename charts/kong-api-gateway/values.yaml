apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-kong

spec:
  replicas: {{ .Values.kong.replicaCount | default 1 }}

  selector:
    matchLabels:
      app: kong

  template:
    metadata:
      labels:
        app: kong

    spec:
      containers:
        - name: kong
          image: {{ .Values.kong.image | default "kong/kong-gateway:latest" }}

          env:
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001"

            - name: KONG_ADMIN_GUI_LISTEN
              value: "0.0.0.0:8002"

            # -----------------------------
            # DATABASE (FIXED - STRICT EXTERNAL FIRST)
            # -----------------------------

            {{- $ext := .Values.externalPostgres | default dict }}

            {{- if $ext.enabled }}

            - name: KONG_DATABASE
              value: "postgres"

            - name: KONG_PG_HOST
              value: "{{ $ext.host }}"

            - name: KONG_PG_PORT
              value: "{{ $ext.port | default 5432 }}"

            - name: KONG_PG_USER
              value: "{{ $ext.user }}"

            - name: KONG_PG_PASSWORD
              value: "{{ $ext.password }}"

            - name: KONG_PG_DATABASE
              value: "{{ $ext.database }}"

            {{- else if .Values.postgresql.enabled }}

            - name: KONG_DATABASE
              value: "postgres"

            - name: KONG_PG_HOST
              value: "{{ .Release.Name }}-postgresql"

            - name: KONG_PG_PORT
              value: "5432"

            - name: KONG_PG_USER
              valueFrom:
                secretKeyRef:
                  name: kong-db-secret
                  key: username

            - name: KONG_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kong-db-secret
                  key: password

            - name: KONG_PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: kong-db-secret
                  key: database

            {{- else }}

            {{- fail "No DB configured. Set externalPostgres.enabled=true or postgresql.enabled=true" }}

            {{- end }}

            # -----------------------------
            # PLUGINS
            # -----------------------------
            {{- $plugins := "" }}
            {{- if .Values.kong.plugins.list }}
              {{- $plugins = join "," .Values.kong.plugins.list }}
            {{- else }}
              {{- $plugins = "key-auth,jwt,rate-limiting,prometheus,opentelemetry" }}
            {{- end }}

            - name: KONG_PLUGINS
              value: "{{ $plugins }}"

            # -----------------------------
            # OBSERVABILITY
            # -----------------------------
            - name: KONG_STATUS_LISTEN
              value: "0.0.0.0:8100"

            - name: KONG_TRACING_INSTRUMENTATIONS
              value: "all"

            - name: KONG_TRACING_SAMPLING_RATE
              value: "1.0"

            {{- if .Values.observability.otel.endpoint }}
            - name: KONG_OPENTELEMETRY_ENDPOINT
              value: "{{ .Values.observability.otel.endpoint }}"
            {{- end }}

          ports:
            - containerPort: 8000
            - containerPort: 8001
            - containerPort: 8002
            - containerPort: 8100
