kong:
  image: kong/kong-gateway:latest
  replicaCount: 2

  database:
    enabled: false

  plugins:
    enabled: true
    list:
      - key-auth
      - jwt
      - rate-limiting
      - prometheus
      - opentelemetry

postgresql:
  enabled: true
  auth:
    username: kong
    password: kongpass
    database: kong

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  cpu: 70

observability:
  prometheus:
    enabled: true
    external: true

  grafana:
    enabled: true
    external: true

  otel:
    enabled: true
    endpoint: http://otel-collector:4318

monitoring:
  serviceMonitor:
    enabled: true

plugins:
  keyAuth: true
  jwt: true
  rateLimit: true
  prometheus: true
  opentelemetry: true

tls:
  enabled: false
