kong:
  image: kong/kong-gateway:latest
  replicaCount: 2

  plugins:
    enabled: true
    list:
      - key-auth
      - jwt
      - rate-limiting
      - prometheus
      - opentelemetry

# -------------------------
# USE EXTERNAL POSTGRESQL
# -------------------------
externalPostgres:
  enabled: true
  host: 192.168.8.39
  port: 5432

postgresql:
  enabled: false   # IMPORTANT (disable internal DB)

  auth:
    username: kong
    password: kongpass
    database: kong

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  cpu: 70

observability:
  otel:
    endpoint: http://otel-collector:4318

tls:
  enabled: false
