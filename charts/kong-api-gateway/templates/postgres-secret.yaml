{{- $pg := .Values.postgresql | default dict }}
{{- $auth := $pg.auth | default dict }}

apiVersion: v1
kind: Secret
metadata:
  name: kong-db-secret
type: Opaque
stringData:
  username: {{ default "kong" $auth.username }}
  password: {{ default "kongpass" $auth.password }}
  database: {{ default "kong" $auth.database }}
