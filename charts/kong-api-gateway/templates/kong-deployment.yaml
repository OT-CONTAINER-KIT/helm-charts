apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-kong

spec:
  replicas: {{ .Values.kong.replicaCount | default 1 }}

  selector:
    matchLabels:
      app: kong

  template:
    metadata:
      labels:
        app: kong

    spec:
      containers:
        - name: kong
          image: {{ .Values.kong.image | default "kong/kong-gateway:latest" }}

          env:
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001"

            - name: KONG_ADMIN_GUI_LISTEN
              value: "0.0.0.0:8002"

            # -----------------------------
            # DATABASE MODE (FIXED LOGIC)
            # -----------------------------
            {{- if or .Values.externalPostgres.enabled .Values.postgresql.enabled }}
            - name: KONG_DATABASE
              value: "kong-db"

            - name: KONG_PG_HOST
              value: {{ if .Values.externalPostgres.enabled }}
                      "{{ .Values.externalPostgres.host }}"
                      {{ else }}
                      "{{ .Release.Name }}-postgresql"
                      {{ end }}

            - name: KONG_PG_PORT
              value: "{{ .Values.externalPostgres.port | default 5432 }}"

            - name: KONG_PG_USER
              valueFrom:
                secretKeyRef:
                  name: kong-db-secret
                  key: username

            - name: KONG_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kong-db-secret
                  key: password

            - name: KONG_PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: kong-db-secret
                  key: database

            {{- else }}
            # SAFE FALLBACK (NO CRASH)
            - name: KONG_DATABASE
              value: "off"

            {{- end }}

            # -----------------------------
            # PLUGINS
            # -----------------------------
            - name: KONG_PLUGINS
              value: "{{ join "," .Values.kong.plugins.list }}"

            - name: KONG_STATUS_LISTEN
              value: "0.0.0.0:8100"

            - name: KONG_TRACING_INSTRUMENTATIONS
              value: "all"

            - name: KONG_TRACING_SAMPLING_RATE
              value: "1.0"

            {{- if .Values.observability.otel.endpoint }}
            - name: KONG_OPENTELEMETRY_ENDPOINT
              value: "{{ .Values.observability.otel.endpoint }}"
            {{- end }}

          ports:
            - containerPort: 8000
            - containerPort: 8001
            - containerPort: 8002
            - containerPort: 8100
