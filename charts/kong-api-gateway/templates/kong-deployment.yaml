apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-kong
  namespace: kong

spec:
  replicas: {{ .Values.kong.replicaCount | default 2 }}

  selector:
    matchLabels:
      app: kong

  template:
    metadata:
      labels:
        app: kong

    spec:
      containers:
        - name: kong
          image: {{ .Values.kong.image | default "kong/kong-gateway:latest" }}

          env:
            # -------------------------
            # CORE KONG CONFIG
            # -------------------------
            - name: KONG_DATABASE
              value: "postgres"

            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001"

            - name: KONG_ADMIN_GUI_LISTEN
              value: "0.0.0.0:8002"

            - name: KONG_STATUS_LISTEN
              value: "0.0.0.0:8100"

            # -------------------------
            # POSTGRES CONFIG (EXTERNAL ONLY)
            # -------------------------
            - name: KONG_PG_HOST
              value: "{{ .Values.externalPostgres.host }}"

            - name: KONG_PG_PORT
              value: "{{ .Values.externalPostgres.port | default 5432 }}"

            - name: KONG_PG_USER
              valueFrom:
                secretKeyRef:
                  name: kong-db-secret
                  key: username

            - name: KONG_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kong-db-secret
                  key: password

            - name: KONG_PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: kong-db-secret
                  key: database

            # -------------------------
            # PLUGINS
            # -------------------------
            - name: KONG_PLUGINS
              value: "key-auth,jwt,rate-limiting,prometheus,opentelemetry,request-transformer,acl"

            # -------------------------
            # OBSERVABILITY / TRACING
            # -------------------------
            - name: KONG_TRACING_INSTRUMENTATIONS
              value: "all"

            - name: KONG_TRACING_SAMPLING_RATE
              value: "1.0"

            - name: KONG_OPENTELEMETRY_ENDPOINT
              value: "{{ .Values.observability.otel.endpoint }}"

          ports:
            - containerPort: 8000
            - containerPort: 8001
            - containerPort: 8002
            - containerPort: 8100
