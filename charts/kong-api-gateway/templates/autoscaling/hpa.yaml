{{- $auto := .Values.autoscaling | default dict }}

{{- if $auto.enabled }}

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: {{ .Release.Name }}-kong

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-kong

  minReplicas: {{ default 2 $auto.minReplicas }}
  maxReplicas: {{ default 10 $auto.maxReplicas }}

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ default 70 $auto.cpu }}

{{- end }}
