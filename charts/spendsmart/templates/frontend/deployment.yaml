{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spendsmart.frontend.fullname" . }}
  labels:
    {{- include "spendsmart.labels" . | nindent 4 }}
    app: {{ include "spendsmart.frontend.fullname" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "spendsmart.frontend.fullname" . }}
  template:
    metadata:
      labels:
        {{- include "spendsmart.labels" . | nindent 8 }}
        app: {{ include "spendsmart.frontend.fullname" . }}
      annotations:
        {{- toYaml .Values.frontend.annotations | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.frontend.serviceAccount.name }}

      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}

      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}

          ports:
            - name: uniteconpro-fe
              containerPort: 80
              protocol: TCP

          envFrom:
            - configMapRef:
                name: {{ .Values.frontend.configMap.name }}

          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

      volumes:
        - name: nginx-config
          configMap:
            name: {{ .Values.frontend.nginx.configMap.name }}
{{- end }}
